<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video to Bullets</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Video → Bullets</h1>

    <div class="api-key-warning" id="apiKeyWarning" hidden>
      <p>Set your API key in <a href="#" id="openOptions">Options</a>.</p>
    </div>

    <button id="summarizeBtn">Summarize Current Video</button>

    <label class="lbl">
      Output length:
      <select id="length">
        <option value="short">Short</option>
        <option value="medium" selected>Medium</option>
        <option value="long">Long</option>
      </select>
    </label>

    <pre id="status" class="status"></pre>
    <div id="result" class="result"></div>

    <footer>
      <a href="#" id="openOptions2">Options</a>
    </footer>
  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
